name: 功能建议
description: 提出新能力、改进现有交互或适配新设备
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 需求背景
      description: 你遇到的具体场景与痛点，而不是直接给方案
      placeholder: "扫描小件时，转台每 15° 停一次，但融合后接缝明显……"
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的方案
      description: 你希望它如何工作（界面、流程、输出）
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
    validations:
      required: false
  - type: dropdown
    id: scope
    attributes:
      label: 影响范围
      multiple: true
      options:
        - 采集 / 预览
        - 转台 / 融合
        - 3D 查看 / 测量
        - 标定 / 几何
        - 安装器 / 驱动
        - UI / 交互
        - 文档
        - 其他
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: 确认
      options:
        - label: 我已搜索现有 Issue 与 README，确认不是已有功能或已知限制
          required: true
